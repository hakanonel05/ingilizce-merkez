[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# `netlify dev`: derlenmiş çıktıyı (dist/) + API fonksiyonlarını tek adresten
# servis eder — production'daki gibi tek origin'den reading + katmanlı.
# Kaynak değiştikçe `npm run build` ile yeniden derleyip sayfayı yenilemek gerekir.
[dev]
  framework = "#static"
  publish = "dist"
  functions = "netlify/functions"
  autoLaunch = false

# /api/* -> Express'i saran serverless fonksiyon (Katmanlı'nın YZ uçları)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Katmanlı İngilizce tek sayfa uygulaması
[[redirects]]
  from = "/katmanli/*"
  to = "/katmanli/index.html"
  status = 200

# Reading (kök) tek sayfa uygulaması
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[functions."api"]
  timeout = 26
