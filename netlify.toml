[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# `netlify dev`: derlenmiş çıktıyı (dist/) + API fonksiyonlarını tek adresten
# servis eder — production'daki gibi tek origin'den reading + katmanlı.
# Kaynak değiştikçe `npm run build` ile yeniden derleyip sayfayı yenilemek gerekir.
[dev]
  framework = "#static"
  publish = "dist"
  functions = "netlify/functions"
  autoLaunch = false

# DENEME: EnglishClub'a Netlify'ın KENDİ vekiliyle gitmek.
#
# Dikte alıştırmaları EnglishClub'dan çekiliyor ama site Cloudflare
# arkasında ve veri merkezi isteklerine "Just a moment..." doğrulama
# sayfası dönüyor (ölçüldü: fonksiyondan 200 ile 5705 baytlık challenge).
# Bu kural isteği fonksiyondan değil Netlify'ın kenar ağından çıkarıyor;
# farklı bir ağdan geçtiği için doğrulamaya takılmayabilir.
#
# Aynı zamanda sesi AYNI ORIGIN'e taşıyor: öyle olursa tarayıcı ses
# baytlarına erişebiliyor ve cevap metni Whisper ile çıkarılabiliyor
# (şu an CORS yüzünden mümkün değil).
[[redirects]]
  from = "/ec/*"
  to = "https://www.englishclub.com/:splat"
  status = 200
  force = true

# /api/* -> Express'i saran serverless fonksiyon (Katmanlı'nın YZ uçları)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Katmanlı İngilizce tek sayfa uygulaması
[[redirects]]
  from = "/katmanli/*"
  to = "/katmanli/index.html"
  status = 200

# Konuşma (görsel betimleme) tek sayfa uygulaması
[[redirects]]
  from = "/konusma/*"
  to = "/konusma/index.html"
  status = 200

# Kullanım kılavuzu STATİK bir sayfa (dist/kilavuz/), tek sayfa uygulaması
# değil. Netlify var olan dosyayı zaten force olmayan bir rewrite'ten önce
# servis eder, ama sondaki eğik çizgisiz "/kilavuz" isteği dizin çözümüne
# kalıyordu; bu kural o belirsizliği kaldırıyor.
[[redirects]]
  from = "/kilavuz"
  to = "/kilavuz/index.html"
  status = 200

# Reading (kök) tek sayfa uygulaması
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[functions."api"]
  timeout = 26

# Supabase ucretsiz plani bir hafta hareketsiz kalan projeyi askiya alir ve
# alt alan adini kaldirir; uygulama o anda giris yapamaz hale gelir. Gunluk
# tek bir sorgu bunu onler (bkz. netlify/functions/keepalive.ts).
[functions."keepalive"]
  schedule = "@daily"
