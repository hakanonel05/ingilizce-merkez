[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# /api/* -> Express'i saran serverless fonksiyon (Katmanlı'nın YZ uçları)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Katmanlı İngilizce tek sayfa uygulaması
[[redirects]]
  from = "/katmanli/*"
  to = "/katmanli/index.html"
  status = 200

# Reading (kök) tek sayfa uygulaması
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[functions."api"]
  timeout = 26
