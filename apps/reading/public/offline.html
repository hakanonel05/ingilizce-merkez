<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çevrimdışı — Lexis Trainer</title>
    <style>
      body {
        font-family: Georgia, serif;
        background: #f4f1ec;
        color: #1a1a2e;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      .card {
        background: white;
        padding: 3rem 2rem;
        border: 1px solid #e0d8cc;
        max-width: 400px;
      }
      .icon { font-size: 3rem; margin-bottom: 1rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #666; font-family: sans-serif; font-size: 0.9rem; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.75rem 2rem;
        background: #1a1a2e;
        color: white;
        text-decoration: none;
        font-family: sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📚</div>
      <h1>Çevrimdışısınız</h1>
      <p>İnternet bağlantısı yok. Daha önce açtığınız pasajlar ve çalışmalarınız mevcut — bağlantı gelince yeni içerikler yüklenebilir.</p>
      <a href="/">Uygulamaya Dön</a>
    </div>
  </body>
</html>
